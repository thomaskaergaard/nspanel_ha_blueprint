---
# Structural .HMI changes (new pages, new or replaced pictures) need Nextion Editor,
# because it keeps a checksummed copy of the resource directory that the repo tools
# can't write. This workflow drives the editor on a Windows runner, compiles each
# result as a check and commits the saved .HMI files.
name: Edit HMI structure

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Space separated HMI variants, e.g. nspanel_eu nspanel_us"
        required: true
        default: nspanel_eu
      copy_page:
        description: "Page to copy to the end of the page list (empty = none)"
        required: false
        default: ""
      add_pictures:
        description: "Space separated PNG paths to import as new pictures (empty = none)"
        required: false
        default: ""
      replace_pictures:
        description: "Space separated picture ids to replace from hmi/dev/ui/<model>/pics (empty = none)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  structure:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pywinauto pillow

      - name: Download Nextion Editor
        shell: pwsh
        run: |
          Invoke-WebRequest "https://nextion.tech/download/nextion-setup-v1-68-2.zip" -OutFile editor.zip
          Expand-Archive editor.zip -DestinationPath nextion-editor

      - name: Edit structure and compile
        shell: pwsh
        env:
          VARIANTS: ${{ github.event.inputs.variants }}
          COPY_PAGE: ${{ github.event.inputs.copy_page }}
          ADD_PICTURES: ${{ github.event.inputs.add_pictures }}
          REPLACE_PICTURES: ${{ github.event.inputs.replace_pictures }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($variant in ($env:VARIANTS -split ' ' | Where-Object { $_ })) {
            $argv = @("tools/nextion_editor_structure.py", "hmi/$variant.HMI",
                      "--editor-dir", "nextion-editor", "--debug-dir", "debug")
            if ($env:COPY_PAGE) { $argv += @("--copy-page", $env:COPY_PAGE) }
            foreach ($png in ($env:ADD_PICTURES -split ' ' | Where-Object { $_ })) { $argv += @("--add-picture", $png) }
            foreach ($id in ($env:REPLACE_PICTURES -split ' ' | Where-Object { $_ })) { $argv += @("--replace-picture", $id) }
            python @argv
            if ($LASTEXITCODE) { throw "editing $variant failed" }
            python tools/nextion_compile_tft.py "hmi/$variant.HMI" --editor-dir nextion-editor --out-dir out --debug-dir debug
            if ($LASTEXITCODE) { throw "compiling $variant failed" }
          }
          python tools/nextion_hmi_sync.py --check --all -v

      - name: Commit the saved .HMI files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hmi/*.HMI
          git commit -m "Edit .HMI structure with Nextion Editor: ${{ github.event.inputs.variants }}" \
            -m "copy page: '${{ github.event.inputs.copy_page }}', add pictures: '${{ github.event.inputs.add_pictures }}', replace pictures: '${{ github.event.inputs.replace_pictures }}'"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structure-debug
          path: debug/
